<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی پلیر موزیک</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 10s linear infinite;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-800 to-black min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 w-full max-w-sm shadow-2xl relative overflow-hidden text-white flex flex-col items-center justify-center min-h-[600px]">
        
        <div class="relative w-48 h-48 mb-8">
            <img id="cover" src="https://picsum.photos/seed/music1/400/400" 
                 alt="Album Cover" 
                 class="w-full h-full rounded-full object-cover shadow-2xl border-4 border-white/5 transition-all duration-700"
            >
            <div id="status-badge" class="absolute inset-0 rounded-full bg-black/50 backdrop-blur-sm flex items-center justify-center opacity-100 transition-opacity duration-300">
                <span class="text-base font-bold tracking-widest text-white/90 uppercase shadow-black drop-shadow-md">Paused</span>
            </div>
        </div>

        <div class="text-center mb-8 w-full">
            <h2 id="title" class="text-xl font-bold truncate px-2">Sebebi Yar</h2>
            <h3 id="artist" class="text-cyan-400/80 text-sm mt-2 font-medium truncate px-2">BLOK3</h3>
        </div>

        <!-- بخش نوار پیشرفت و زمان -->
        <!-- dir="ltr" اضافه شد تا نوار و زمان‌ها از چپ به راست باشند -->
        <div class="w-full mb-6" dir="ltr">
            
            <div id="progress-container" class="relative w-full h-2 bg-gray-700 rounded-full cursor-pointer mt-2 overflow-hidden">
                <!-- گرادیانت هم برای پر شدن از چپ به راست از to-l به to-r تغییر یافت -->
                <div id="progress" class="h-full bg-gradient-to-r from-cyan-400 to-teal-500 w-0 transition-all duration-100 ease-linear shadow-[0_0_10px_rgba(34,211,238,0.5)]"></div>
            </div>
            
            <!-- نمایش زمان‌ها -->
            <div class="flex justify-between text-xs text-gray-500 mt-2 font-mono">
                <span id="curr-time">0:00</span> <!-- سمت چپ -->
                <span id="dur-time">0:00</span>  <!-- سمت راست -->
            </div>
        </div>

        <div class="flex items-center justify-between w-full px-2 mt-2">
            <button id="next" class="text-gray-400 hover:text-cyan-400 transition transform hover:scale-110 active:scale-95 focus:outline-none">
                <i class="fas fa-forward text-xl"></i>
            </button>

            <button id="play" class="w-16 h-16 rounded-full bg-gradient-to-br from-cyan-400 to-teal-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 transition transform hover:scale-105 active:scale-95 focus:outline-none text-white">
                <i class="fas fa-play text-2xl mr-[-4px]"></i> 
            </button>

            <button id="prev" class="text-gray-400 hover:text-cyan-400 transition transform hover:scale-110 active:scale-95 focus:outline-none">
                <i class="fas fa-backward text-xl"></i>
            </button>
        </div>
    </div>

    <audio id="audio"></audio>

    <script>
        const songs = [
            {
                title: "Sebebi Yar",
                artist: "BLOK3",
                cover: "src/img/download.jpg",
                src: "src/music/SEBEBI YAR   BLOK3.m4a"
            },
            {
                title: "Shadmehr Aghili",
                artist: "Paeiz",
                cover: "src/img/download.jpg",
                src: "src/music/Shadmehr Aghili - Paeiz.mp3"
            },
            {
                title: "Mehdi Jahani",
                artist: "Tooye Tanhaeem",
                cover: "src/img/download.jpg",
                src: "src/music/Tooye Tanhaeem   Mehdi Jahani.m4a"
            },
            {
                title: "Ai Version",
                artist: "Seda Kon Mara",
                cover: "src/img/download.jpg",
                src: "src/music/Ai Version-Seda Kon Mara-musicdel.ir-128.mp3"
            }
        ];

        const cover = document.getElementById('cover');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const progressContainer = document.getElementById('progress-container');
        const progress = document.getElementById('progress');
        const currTime = document.getElementById('curr-time');
        const durTime = document.getElementById('dur-time');
        const statusBadge = document.getElementById('status-badge');
        const playIcon = playBtn.querySelector('i');

        let songIndex = 0;
        let isPlaying = false;

        function loadSong(song) {
            title.innerText = song.title;
            artist.innerText = song.artist;
            cover.src = song.cover;
            audio.src = song.src;
        }

        function playSong() {
            isPlaying = true;
            cover.classList.add('animate-spin-slow');
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
            playIcon.classList.remove('mr-[-4px]'); 
            statusBadge.classList.remove('opacity-100');
            statusBadge.classList.add('opacity-0');
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            cover.classList.remove('animate-spin-slow');
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            playIcon.classList.add('mr-[-4px]');
            statusBadge.classList.remove('opacity-0');
            statusBadge.classList.add('opacity-100');
            audio.pause();
        }

        function prevSong() {
            songIndex--;
            if (songIndex < 0) {
                songIndex = songs.length - 1;
            }
            loadSong(songs[songIndex]);
            if (isPlaying) playSong();
        }

        function nextSong() {
            songIndex++;
            if (songIndex > songs.length - 1) {
                songIndex = 0;
            }
            loadSong(songs[songIndex]);
            if (isPlaying) playSong();
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            if(isNaN(duration)) return;

            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;

            const currentMin = Math.floor(currentTime / 60);
            let currentSec = Math.floor(currentTime % 60);
            if (currentSec < 10) currentSec = `0${currentSec}`;
            currTime.innerText = `${currentMin}:${currentSec}`;

            const totalMin = Math.floor(duration / 60);
            let totalSec = Math.floor(duration % 60);
            if (totalSec < 10) totalSec = `0${totalSec}`;
            durTime.innerText = `${totalMin}:${totalSec}`;
        }

        function setProgress(e) {
            const width = this.clientWidth;
            // چون حالا LTR است، محاسبه استاندارد (کلیک تقسیم بر کل) صحیح است
            const clickX = e.offsetX;
            const duration = audio.duration;
            
            audio.currentTime = (clickX / width) * duration;
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        });

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', nextSong);
        progressContainer.addEventListener('click', setProgress);

        loadSong(songs[songIndex]);
    </script>
</body>
</html>
